[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "xraymyrepo"
version = "0.1.0"
description = "Reconstructs a repository into a Codebase Intelligence Model (CIM)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[project.scripts]
xray = "xraymyrepo.analyzer.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx2>=2.13",  # FastAPI TestClient (Starlette prefers it over httpx)
]
# PostgreSQL persistence (xraymyrepo.persistence).
postgres = [
    "psycopg[binary]>=3.2",
]
# Read-only HTTP API over persisted snapshots (xraymyrepo.api).
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
]
# Needed to run the PostgreSQL tests (tests/test_migration_db.py, tests/test_persistence_db.py).
db-tests = [
    "psycopg[binary]>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xraymyrepo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: large generated data; deselect with -m \"not slow\"",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["^fixtures/"]

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*"]
ignore_missing_imports = true
